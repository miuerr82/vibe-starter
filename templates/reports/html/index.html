<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Report</title>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1f2933; background: #f7f8fa; }
    main { max-width: 1120px; margin: 0 auto; padding: 32px 20px; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { line-height: 1.6; }
    .panel { background: #fff; border: 1px solid #d9dee7; border-radius: 8px; padding: 20px; }
    code { background: #eef2f7; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <main>
    <section class="panel">
      <h1>Project Report</h1>
      <p>這是 report dashboard placeholder。請先由 AI 整理 <code>vibe-coding/reports/data/project-state.yml</code> 與 <code>vibe-coding/reports/current-status.md</code>，再執行：</p>
      <p><code>bash ./vibe-coding/vibe-starter/scripts/report --open</code></p>
      <p>正式 dashboard 會顯示 <code>source_summarized_at</code> 與 <code>generated_at</code>。</p>
    </section>
  </main>

</html>
